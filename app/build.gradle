plugins { id 'com.android.application' }
android {
    namespace 'local.jcc.probe'
    compileSdk 35
    defaultConfig {
        applicationId 'local.jcc.probe'
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName '0.3.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs += ['../.tools/ocr/assets'] } }
}
dependencies { implementation files('../.tools/ocr/tesseract.aar') }
